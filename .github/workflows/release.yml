name: Release

on:
  push:
    tags:
      - "v*"
    branches:
      - "release-v*"

permissions:
  contents: write

jobs:
  package:
    name: Package CLI
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release-}"
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 64
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Run tests
        run: swift test

      - name: Package release archive
        run: scripts/package-release.sh

      - name: Verify package checksum
        run: cd dist && shasum -a 256 -c *.tar.gz.sha256

      - name: Upload release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/*.tar.gz dist/*.tar.gz.sha256 --clobber
          else
            gh release create "${RELEASE_TAG}" dist/*.tar.gz dist/*.tar.gz.sha256 \
              --target "${GITHUB_SHA}" \
              --title "${RELEASE_TAG}" \
              --generate-notes
          fi

      - name: Generate Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/update-homebrew-formula.sh

      - name: Verify Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-homebrew-formula.sh --version "${RELEASE_TAG}"

      - name: Upload Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" Formula/ascendkit.rb --clobber

      - name: Upload installer script
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${RELEASE_TAG}" scripts/install-ascendkit.sh --clobber

      - name: Verify uploaded release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-release-assets.sh --version "${RELEASE_TAG}"
